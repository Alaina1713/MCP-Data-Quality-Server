[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "datalens-mcp"
version = "0.1.0"
description = "An MCP server for exploring datasets, profiling data quality, and running safe analytical SQL."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Alaina Rahim" }]
dependencies = [
  "mcp[cli]>=1.2.0",
  "duckdb>=1.1.0"
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6.0"]

[project.scripts]
datalens-mcp = "datalens_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/datalens_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
